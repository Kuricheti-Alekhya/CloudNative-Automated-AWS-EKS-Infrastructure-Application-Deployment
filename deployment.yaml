apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbite
  namespace: quickbite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickbite
  template:
    metadata:
      labels:
        app: quickbite
    spec:
      containers:
        - name: quickbite
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-2.amazonaws.com/quickbite:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quickbite
  namespace: quickbite
spec:
  type: LoadBalancer
  selector:
    app: quickbite
  ports:
    - port: 80
      targetPort: 5000
